<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Places, photos, and notes from Lucas Gravina’s travels." />
  <meta name="theme-color" content="#f8f9f7" />
  <title>Maps — Lucas Gravina</title>
  <link rel="icon" href="../assets/maps-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="map.css" />
  <script src="../assets/vendor/leaflet/leaflet.js" defer></script>
  <script src="map.js" defer></script>
</head>
<body>
  <main class="map-app">
    <header class="map-toolbar">
      <div class="map-identity">
        <img src="../assets/maps-icon.svg" width="32" height="32" alt="" />
        <div><h1>Places I’ve been</h1><p>Lucas Gravina</p></div>
      </div>
      <nav class="map-actions" aria-label="Map controls">
        <button type="button" id="places-toggle" aria-expanded="false" aria-controls="places-panel" hidden>Places</button>
        <button type="button" id="reset-map" title="Show the whole world">World</button>
        <a class="back-link" href="../">Desktop ↗</a>
      </nav>
    </header>
    <div class="map-body">
      <aside id="places-panel" class="places-panel" aria-label="Trips" hidden>
        <label for="trip-search">Find a place</label>
        <input id="trip-search" type="search" placeholder="Search my trips" autocomplete="off" />
        <div id="trip-list"></div>
        <p id="search-empty" hidden>No matching places.</p>
      </aside>
      <div class="map-surface">
        <div id="travel-map" aria-label="Interactive world map. Use arrow keys to pan and plus or minus to zoom."></div>
        <div class="map-note" id="map-note" role="status"><strong>A world of little stories.</strong><span>Trip dots, photos, and notes coming soon.</span></div>
        <div class="map-error" id="map-error" role="status" hidden></div>
        <section class="trip-detail" id="trip-detail" aria-labelledby="trip-title" hidden>
          <button class="detail-close" id="detail-close" type="button" aria-label="Close trip details">×</button>
          <p class="trip-date" id="trip-date"></p>
          <h2 id="trip-title"></h2>
          <p id="trip-location"></p>
          <p class="trip-bio" id="trip-bio"></p>
          <div id="trip-photos" class="trip-photos"></div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
