<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Places, photos, and notes from Lucas Gravina’s travels." />
  <meta name="theme-color" content="#f5f5f3" />
  <title>Travels — Lucas Gravina</title>
  <link rel="icon" href="../assets/maps-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="map.css?v=20260925-countries" />
  <script src="../assets/vendor/leaflet/leaflet.js" defer></script>
  <script src="map.js?v=20260925-countries" defer></script>
</head>
<body>
  <main class="map-app" aria-label="Travel map">
    <div class="map-surface">
      <div id="travel-map" aria-label="Interactive world map. Select a trip pin for details. Use arrow keys to pan and plus or minus to zoom."></div>
      <div class="map-error" id="map-error" role="status" hidden></div>
    </div>
    <section class="countries-overview" id="countries-overview" aria-labelledby="countries-title">
      <h1 id="countries-title">Countries I've Backpacked/<wbr>Traveled!</h1>
      <!-- Add Lucas's introductory paragraph here when he supplies it. Empty text is hidden. -->
      <p class="travels-intro" id="travels-intro"></p>
      <ul class="country-list" id="country-list" aria-label="Countries in my travel list"></ul>
    </section>
    <section class="trip-detail" id="trip-detail" aria-labelledby="trip-title" hidden>
      <button class="detail-back" id="detail-close" type="button" aria-label="Back to countries">← Countries</button>
      <p class="section-label">Where</p>
      <h1 id="trip-title"></h1>
      <p class="trip-location" id="trip-location"></p>
      <div class="detail-section">
        <h2 class="section-label">Date</h2>
        <p id="trip-date"></p>
      </div>
      <div class="detail-section">
        <h2 class="section-label">About</h2>
        <p class="trip-bio" id="trip-bio"></p>
      </div>
      <div class="detail-section">
        <h2 class="section-label">Photos</h2>
        <div id="trip-photos" class="trip-photos"></div>
        <p class="empty-value" id="photos-empty">To be added</p>
      </div>
    </section>
  </main>
</body>
</html>
